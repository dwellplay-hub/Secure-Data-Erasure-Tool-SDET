name: SDET Cross-Platform Build

# Skrip ini akan berjalan apabila anda 'push' ke branch main, 
# atau apabila anda meletakkan tag versi (contoh: v1.0.0)
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' 

permissions:
  contents: write # Dibenarkan untuk mencipta file di bahagian Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Buka 3 OS serentak (Windows, Ubuntu Linux, macOS)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller

    # ---------------------------------------------------------
    # PEMBINAAN CLI (COMMAND-LINE INTERFACE)
    # KRITIKAL: Flag --console memastikan ia tidak bisu di Windows
    # Flag --clean membuang sisa cache (bulletproof build)
    # ---------------------------------------------------------
    - name: Build CLI (PyInstaller)
      run: >
        pyinstaller --clean --onefile --console 
        --name SDET-CLI-${{ runner.os }} 
        sdet/sdet_cli.py

    # ---------------------------------------------------------
    # PEMBINAAN GUI (GRAPHICAL USER INTERFACE)
    # KRITIKAL: Flag --windowed menyembunyikan terminal hitam
    # ---------------------------------------------------------
    - name: Build GUI (PyInstaller)
      run: >
        pyinstaller --clean --onefile --windowed --collect-all customtkinter 
        --name SDET-GUI-${{ runner.os }} 
        sdet/sdet_gui.py

    # KHAS UNTUK MAC: Mac menghasilkan folder .app untuk GUI, kita perlu zipkannya
    - name: Zip macOS App Bundle (macOS Only)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r SDET-GUI-macOS.zip SDET-GUI-macOS.app
        rm -rf SDET-GUI-macOS.app

    # Simpan perisian yang dah siap ke tab 'Actions' (Artifacts)
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SDET-Binaries-${{ runner.os }}
        path: dist/*

    # Hantar terus ke bahagian 'Releases' jika anda push menggunakan tag (v1.0.0)
    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*